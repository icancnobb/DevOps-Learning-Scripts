services:
  web-dev:
    image: nginx:latest
    container_name: dev-server-v3
    ports:
      - "8080:80"
    volumes:
      - .:/usr/share/nginx/html
    networks:
      - app-network
    environment:
      - PLAYER_NAME=Sawamura_Eijun

  # 模拟一个后端数据库，感受一下“集群”的感觉
  db:
    image: mysql:8.0
    container_name: dev-db
    environment:
      MYSQL_ROOT_PASSWORD: example_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
